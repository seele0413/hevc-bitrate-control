[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hevc-interframe-lab"
version = "1.9.0"
description = "面向固定监控场景的 H.264 原生与 H.265 固定参数对比工具"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["hevc_lab*"]
