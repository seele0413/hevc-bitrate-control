[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hevc-interframe-lab"
version = "2.2.1"
description = "面向远程监控场景的 H.264 源码直流与 H.265 独立固定延迟实时工具"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.20",
]

[tool.setuptools.packages.find]
include = ["hevc_lab*"]
