[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hevc-interframe-lab"
version = "2.3.0"
description = "面向固定监控场景的 H.264 源码直流与轻度降噪 H.265 实时对比工具"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.100",
  "uvicorn>=0.20",
]

[tool.setuptools.packages.find]
include = ["hevc_lab*"]
