<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V1.6 RTSP 实时双路编码</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css?v=1.6.0-live2" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>RTSP 实时双路编码</h1>
        <p class="subtitle">H.264 原生参数编码 / H265编码参数优化 · V1.6</p>
      </header>

      <form class="stream-form" id="streamForm">
        <input
          id="rtspInput"
          class="rtsp-input"
          type="password"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="rtsp://user:password@camera-ip/stream"
          aria-label="原始 RTSP 地址"
          required
        />
        <button class="primary-btn" id="startBtn" type="submit">启动</button>
        <button class="secondary-btn" id="stopBtn" type="button" disabled>停止</button>
      </form>

      <section class="stage" id="stage" aria-label="实时编码对比画面">
        <video class="media base" id="h264Video" playsinline muted></video>
        <video class="media ours" id="h265Video" playsinline muted></video>

        <div class="label base">
          <div class="name">H.264 原生参数编码</div>
          <div>Resolution: <span id="h264Resolution">--</span></div>
          <div>Bitrate: <span class="hl" id="h264Bitrate">--</span></div>
          <div>CRF: <span id="h264Crf">原生默认</span></div>
          <div>Latency: <span id="h264Latency">--</span></div>
        </div>

        <div class="label ours">
          <div class="name">H265编码参数优化</div>
          <div>Resolution: <span id="h265Resolution">--</span></div>
          <div>Bitrate: <span class="hl" id="h265Bitrate">--</span></div>
          <div>CRF: <span id="h265Crf">36.0</span></div>
          <div>Latency: <span id="h265Latency">--</span></div>
        </div>

        <div class="divider" id="divider" tabindex="0" role="slider" aria-label="对比分割线" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
          <div class="badge">
            <span class="small">码率差</span>
            <span class="big" id="savingBadge">--</span>
          </div>
        </div>

        <div class="empty" id="emptyState">
          <div class="empty-title">等待 RTSP</div>
          <div class="empty-desc">启动后显示两路实时编码预览</div>
        </div>
      </section>

      <div class="controls" id="controls">
        <button class="ctrl-btn" id="playBtn" type="button" aria-label="播放 / 暂停" disabled>
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
        </button>
        <div class="live-chip" id="liveChip">未连接</div>
        <div class="time" id="timeLabel">HLS: --</div>
      </div>

      <p class="preview-note">画面为两路原生编码结果的等价 H.264 预览，码率统计来自预览转码之前。</p>

      <section class="metrics-grid" aria-label="实时状态">
        <div>
          <span class="metric-label">流状态</span>
          <strong id="streamStatus">idle</strong>
        </div>
        <div>
          <span class="metric-label">RTSP 地址</span>
          <strong id="maskedUrl">--</strong>
        </div>
        <div>
          <span class="metric-label">输出状态</span>
          <strong id="outputStatus">--</strong>
        </div>
        <div>
          <span class="metric-label">FFmpeg</span>
          <strong id="errorText">--</strong>
        </div>
      </section>

      <p class="load-error" id="runtimeError" hidden></p>
    </main>

    <script src="/vendor/hls.min.js?v=1.5.17" defer></script>
    <script src="/app.js?v=1.6.0-live2" defer></script>
  </body>
</html>
