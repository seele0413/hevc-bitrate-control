<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>H.265 编码策略对比 · V1.4</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1 id="pageTitle">H.265 编码策略对比 · V1.4</h1>
        <p class="subtitle" id="pageSubtitle">x265 原生默认 vs 通用无 ROI 方案 · 60 秒真实监控素材</p>
      </header>

      <nav class="strategy-tabs" role="tablist" aria-label="方案类型">
        <button class="strategy-tab active" id="tabGeneric" type="button" data-target="generic" role="tab" aria-selected="true">
          <span class="tab-title" id="genericTabTitle">通用</span>
          <span class="tab-desc" id="genericTabDesc">--</span>
        </button>
        <button class="strategy-tab" id="tabSpecialized" type="button" data-target="specialized" role="tab" aria-selected="false">
          <span class="tab-title" id="specializedTabTitle">专用</span>
          <span class="tab-desc" id="specializedTabDesc">专用方案对比待补充</span>
        </button>
      </nav>

      <section class="viewer" id="viewerGeneric">
        <div class="stage" id="stage">
          <video class="media base" id="baseVideo" preload="auto" playsinline loop></video>
          <video class="media ours" id="oursVideo" preload="auto" playsinline loop muted></video>

          <div class="label base">
            <div class="name" id="baseName">默认方案</div>
            <div>Resolution: <span id="baseResolution">--</span></div>
            <div>Bitrate: <span class="hl" id="baseBitrate">--</span></div>
            <div>CRF: <span id="baseCrf">--</span></div>
          </div>

          <div class="label ours">
            <div class="name" id="oursName">保守方案</div>
            <div>Resolution: <span id="oursResolution">--</span></div>
            <div>Bitrate: <span class="hl" id="oursBitrate">--</span></div>
            <div>CRF: <span id="oursCrf">--</span></div>
          </div>

          <div class="divider" id="divider" tabindex="0" role="slider" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
            <div class="badge">
              <span class="small">码率节省</span>
              <span class="big" id="savingBadge">--</span>
            </div>
          </div>
        </div>

        <div class="controls" id="controls">
          <button class="ctrl-btn" id="playBtn" type="button" aria-label="播放 / 暂停">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
          </button>
          <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度" />
          <div class="time" id="timeLabel">0:00 / 0:00</div>
          <select class="rate" id="rateSelect" aria-label="播放倍速">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </div>

        <div class="metrics" id="metricsText">--</div>
        <div class="footer-row">
          <button class="download-btn" id="downloadBtn" type="button" title="下载文件" aria-label="下载文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12"></path><path d="M7 11l5 5 5-5"></path><path d="M5 21h14"></path>
            </svg>
          </button>
          <div class="download-menu" id="downloadMenu" hidden></div>
        </div>
      </section>

      <section class="viewer" id="viewerSpecialized" hidden>
        <div class="placeholder-box">
          <svg class="icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <div class="title" id="placeholderTitle">专用方案对比待补充</div>
          <div class="desc" id="placeholderDesc">本 Tab 预留，后续将接入专用场景下的 ROI / 降噪方案对比结果。</div>
        </div>
      </section>

      <p class="load-error" id="loadError" hidden></p>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
